<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>PSTU — Apresentação 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Barlow+Condensed:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ═══ TOKENS ═══════════════════════════════════════════ */
:root{
  --red:#CC1111;--red-lt:#fff3f3;--red-bd:#f5cccc;
  --dark:#111;--deep:#1c1c2e;--gray:#555;--gray-lt:#888;
  --border:#ddd;--bg-lt:#f5f5f5;--r:4px;--r-md:8px;
  --dur:.28s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Barlow',sans-serif;overflow:hidden;background:#1a1a1a}

/* ═══ SHELL ══════════════════════════════════════════════ */
#shell{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:10px;transition:padding var(--dur)}

/* ═══ VIEWPORT ═══════════════════════════════════════════ */
#viewport{
  display:flex;overflow:hidden;
  box-shadow:0 8px 56px rgba(0,0,0,.55);
  border-radius:var(--r-md);
  background:#111;
  /* tamanho e direção controlados por classe no body */
  transition:max-width var(--dur) ease, max-height var(--dur) ease, flex-direction var(--dur);
}

/* ════════ RETRATO ═══════════════════════════════════════ */
body.retrato #shell{padding:10px}
body.retrato #viewport{flex-direction:column;width:100%;max-width:520px;height:100%;max-height:900px}
body.retrato #sidebar{display:none}
body.retrato #nav-bar{display:flex;flex-direction:column}

/* ════════ PAISAGEM ══════════════════════════════════════ */
body.paisagem #shell{padding:8px}
body.paisagem #viewport{flex-direction:row;width:100%;max-width:960px;height:100%;max-height:600px}
body.paisagem #nav-bar{display:none}
body.paisagem #sidebar{display:flex}

/* ═══ BARRA DE PROGRESSO HORIZONTAL (retrato) ════════════ */
#prog-h-wrap{height:3px;background:rgba(255,255,255,.1);flex-shrink:0}
#prog-h{height:100%;background:var(--red);transition:width .3s ease;width:0%}
body.paisagem #prog-h-wrap{display:none}

/* ═══ NAV BAR HORIZONTAL (retrato) ═══════════════════════ */
#nav-bar{
  flex-shrink:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,.07);
  padding:9px 16px;
  align-items:center;justify-content:space-between;gap:8px
}
#nav-bar button{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r);padding:8px 16px;
  font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;
  color:rgba(255,255,255,.7);cursor:pointer;transition:all .15s
}
#nav-bar button:hover:not(:disabled){background:var(--red);color:#fff;border-color:var(--red)}
#nav-bar button:disabled{opacity:.22;cursor:default}
#counter-h{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:rgba(255,255,255,.35);letter-spacing:.08em;user-select:none}

/* ═══ SIDEBAR VERTICAL (paisagem) ════════════════════════ */
#sidebar{
  width:52px;flex-shrink:0;flex-direction:column;
  align-items:center;justify-content:space-between;
  background:rgba(0,0,0,.6);backdrop-filter:blur(12px);
  border-right:1px solid rgba(255,255,255,.07);
  padding:12px 0
}
#sidebar button{
  width:36px;height:36px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:var(--r);display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.6);cursor:pointer;transition:all .15s;flex-shrink:0
}
#sidebar button:hover:not(:disabled){background:var(--red);color:#fff;border-color:var(--red)}
#sidebar button:disabled{opacity:.2;cursor:default}
#prog-v-wrap{flex:1;width:3px;background:rgba(255,255,255,.1);border-radius:2px;margin:10px 0;position:relative;overflow:hidden}
#prog-v{width:100%;background:var(--red);transition:height .3s ease;height:0%;position:absolute;bottom:0;border-radius:2px}
#counter-v{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:rgba(255,255,255,.3);letter-spacing:.05em;writing-mode:vertical-rl;user-select:none;margin:8px 0}

/* ═══ SLIDES WRAP ════════════════════════════════════════ */
#slides-wrap{flex:1;overflow:hidden;position:relative}

/* ═══ SLIDE BASE ══════════════════════════════════════════ */
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  overflow:hidden;
  opacity:0;pointer-events:none;
  transform:translateX(48px);
  transition:opacity var(--dur) ease, transform var(--dur) ease
}
.slide.ativo{opacity:1;pointer-events:auto;transform:translateX(0)}
.slide.sair-esq{opacity:0;transform:translateX(-48px);pointer-events:none}
.slide.sair-dir{opacity:0;transform:translateX(48px);pointer-events:none}

/* temas */
.tema-claro   {--bg:#e8ddd2; --fg:#111;    --fg2:#555}
.tema-escuro  {--bg:#1a1a1a; --fg:#f0f0f0; --fg2:rgba(255,255,255,.55)}
.tema-profundo{--bg:#1c1c2e; --fg:#e8e8f0; --fg2:rgba(232,232,240,.55)}
.tema-vermelho{--bg:#CC1111; --fg:#fff;    --fg2:rgba(255,255,255,.75)}
.slide{background:var(--bg,#fff);color:var(--fg,#111)}

/* imagem de fundo */
.bg-img{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;z-index:0}
.bg-dim{position:absolute;inset:0;background:#000;z-index:1}

/* ═══ CONTEÚDO ════════════════════════════════════════════ */
.sc{
  position:relative;z-index:2;
  flex:1;overflow-y:auto;
  padding:20px 22px 24px;
  display:flex;flex-direction:column
}

/* texto com borda branca */
.tb .slide-titulo,.tb .slide-pretitulo,.tb .slide-texto,
.tb .bloco-lista li,.tb .secao-titulo,.tb .capa-titulo,.tb .cit-texto{
  text-shadow:0 0 8px rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.8),
    -1px -1px 0 rgba(0,0,0,.6),1px -1px 0 rgba(0,0,0,.6),
    -1px 1px 0 rgba(0,0,0,.6),1px 1px 0 rgba(0,0,0,.6)
}

/* ══════════ TIPOGRAFIA COMUM ════════════════════════════ */
.slide-modulo{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:5px}
.slide-pretitulo{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2);margin-bottom:7px}
.slide-titulo{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;line-height:1.1;text-transform:uppercase;color:var(--fg);margin-bottom:9px}
.tema-claro .slide-titulo{color:var(--red)}
.slide-subtitulo{font-size:16px;color:var(--fg2);line-height:1.55;margin-bottom:7px;font-style:italic}
.slide-texto{font-size:17px;line-height:1.62;color:var(--fg);margin:5px 0 8px}

/* ══════════ BLOCOS ══════════════════════════════════════ */
.bloco-lista{list-style:none;padding:0;margin:7px 0}
.bloco-lista li{font-size:17px;line-height:1.55;color:var(--fg);padding:3px 0 3px 15px;position:relative}
.bloco-lista li::before{content:'—';position:absolute;left:0;color:var(--red);font-weight:700}

.bloco-proposta{background:rgba(204,17,17,.12);border-left:3px solid var(--r);border-radius:0 var(--r) var(--r) 0;padding:12px 15px;margin:12px 0}
.tema-claro .bloco-proposta{background:var(--red-lt)}
.proposta-titulo{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.proposta-texto{font-size:16px;line-height:1.52;color:var(--red)}
.tema-escuro .proposta-texto,.tema-profundo .proposta-texto{color:#ff9999}

.bloco-diff{background:rgba(255,255,255,.07);border-radius:var(--r);padding:8px 11px;margin:9px 0;font-size:15px;line-height:1.52;color:var(--fg2)}
.tema-claro .bloco-diff{background:#f0f0f0;color:var(--gray)}
.diff-s{font-weight:800;color:var(--red);margin-right:5px}

.bloco-links{padding-top:11px;border-top:1px solid rgba(255,255,255,.1);margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tema-claro .bloco-links{border-color:var(--border)}
.links-label{font-size:14px;font-weight:700;color:var(--fg);flex-shrink:0}
.links-wrap{display:flex;gap:7px;flex-wrap:wrap}
.link-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);padding:6px 11px;font-size:15px;color:var(--fg);text-decoration:none;font-family:'Barlow',sans-serif;transition:background .15s}
.tema-claro .link-btn{background:var(--bg-lt);border-color:var(--border);color:var(--dark)}
.link-btn:hover{background:var(--red);color:#fff;border-color:var(--red)}
.link-icon{width:13px;height:13px;display:flex;flex-shrink:0}
.link-icon svg{width:100%;height:100%}

.linha-acento{width:38px;height:3px;background:var(--red);margin:7px 0 11px;border-radius:2px}

/* ══════════ CAPA ════════════════════════════════════════ */
.capa-pretitulo{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--fg2);margin-bottom:16px}
.capa-titulo{font-family:'Renfrew','Playfair Display',Georgia,serif;font-size:72px;font-weight:900;line-height:.9;text-transform:uppercase;color:var(--fg);margin-bottom:8px}
.capa-subtitulo{font-size:17px;line-height:1.62;color:var(--fg2);margin-bottom:20px}
.enc-titulo{
  font-family:'Barlow Condensed',sans-serif;
  font-size:72px;font-weight:800;line-height:.9;
  text-transform:uppercase;color:var(--fg);margin-bottom:8px;
  letter-spacing:-.01em;
}
.capa-logos{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.capa-logo-img{height:38px;width:auto;border-radius:var(--r);border:1px solid rgba(255,255,255,.15);object-fit:contain;background:rgba(255,255,255,.05)}
.capa-hint{font-size:14px;color:var(--fg2);margin-top:auto;padding-top:16px}

/* ══════════ SEÇÃO ═══════════════════════════════════════ */
.sc-secao{justify-content:flex-end;padding-bottom:30px;position:relative}
.secao-num{position:absolute;top:8px;right:10px;font-family:'Barlow Condensed',sans-serif;font-size:120px;font-weight:800;line-height:1;color:rgba(255,255,255,.05);pointer-events:none;user-select:none;letter-spacing:-.03em}
.secao-pretitulo{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:7px}
.secao-titulo{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:800;text-transform:uppercase;line-height:1.1;color:var(--fg);margin-bottom:12px}
.secao-subtitulo{font-size:17px;color:var(--fg2);line-height:1.62}
.secao-texto{font-size:16px;color:var(--fg2);line-height:1.62;margin-top:7px}

/* ══════════ CITAÇÃO ═════════════════════════════════════ */
.sc-citacao{justify-content:center}
.cit-texto{font-size:19px;line-height:1.72;font-style:italic;color:var(--fg);border-left:3px solid var(--red);padding-left:15px;margin:10px 0}
.cit-fonte{font-size:14px;font-weight:600;color:var(--fg2);text-align:right;margin-bottom:12px}
.cit-nota{font-size:15px;color:var(--fg2);line-height:1.58;border-top:1px solid rgba(255,255,255,.1);padding-top:11px}
.tema-claro .cit-nota{border-color:var(--border)}

/* ══════════ COMPARATIVO ═════════════════════════════════ */
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.comp-col{border-radius:var(--r-md);padding:11px;display:flex;flex-direction:column}
.comp-col.cor-vermelho{background:rgba(204,17,17,.15);border:1px solid rgba(204,17,17,.3)}
.comp-col.cor-escuro{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1)}
.comp-col.cor-cinza{background:rgba(128,128,128,.12);border:1px solid rgba(128,128,128,.2)}
.tema-claro .comp-col.cor-cinza{background:#f5f5f5;border-color:var(--border)}
.tema-claro .comp-col.cor-vermelho{background:var(--red-lt);border-color:var(--red-bd)}
.comp-col-titulo{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid rgba(204,17,17,.25)}
.col-item{font-size:15px;line-height:1.52;color:var(--fg);padding:3px 0}
.col-item-destaque{font-weight:700}

/* ══════════ ESTATÍSTICAS ════════════════════════════════ */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
.stat-card{border-radius:var(--r-md);padding:13px 11px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.stat-card.cor-vermelho{background:var(--red);color:#fff}
.stat-card.cor-escuro{background:rgba(255,255,255,.08);color:var(--fg)}
.tema-claro .stat-card.cor-escuro{background:#1a1a1a;color:#fff}
.stat-num{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;line-height:1}
.stat-desc{font-size:14px;line-height:1.35;font-weight:600}
.stat-fonte{font-size:11px;opacity:.6;margin-top:2px}
.stat-img{display:block;width:calc(100% + 22px);height:52px;object-fit:cover;border-radius:var(--r-md) var(--r-md) 0 0;margin:-13px -11px 8px;flex-shrink:0}
.stat-img.modo-logo{width:100%;margin:0 0 8px;border-radius:var(--r);object-fit:contain;background:#fff;padding:5px 12px;height:38px}

/* ══════════ TIMELINE ════════════════════════════════════ */
.tl-wrap{margin:9px 0;display:flex;flex-direction:column}
.tl-item{display:flex;gap:11px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.tema-claro .tl-item{border-color:var(--border)}
.tl-ano{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:var(--red);min-width:36px;flex-shrink:0;padding-top:1px}
.tl-texto{font-size:16px;line-height:1.52;color:var(--fg)}

/* ══════════ DIVIDIDO ════════════════════════════════════ */
.div-grid{display:flex;flex-direction:column;gap:9px;margin:9px 0}
.div-item{background:rgba(255,255,255,.05);border-radius:var(--r-md);padding:11px;border-left:3px solid var(--red)}
.tema-claro .div-item{background:var(--bg-lt)}
.div-item strong{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--red);display:block;margin-bottom:3px}
.div-item p{font-size:16px;line-height:1.52;color:var(--fg)}

/* ══════════ CARDS ═══════════════════════════════════════ */
.cards-grid{display:flex;flex-direction:column;gap:9px;margin:9px 0}
.card-item{display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,.05);border-radius:var(--r-md);padding:11px}
.tema-claro .card-item{background:var(--bg-lt);border:1px solid var(--border)}
.card-foto{width:42px;height:42px;border-radius:50%;background-size:cover;background-position:center;flex-shrink:0}
.card-foto-vazia{background:var(--red);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:#fff}
.card-nome{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;text-transform:uppercase;color:var(--fg)}
.card-cargo{font-size:12px;color:var(--red);font-weight:600;margin:2px 0 3px}
.card-texto{font-size:15px;line-height:1.45;color:var(--fg2)}

/* ══════════ PAISAGEM — LAYOUTS ESPECIAIS ══════════════════
   Aplica grid de 2 colunas apenas em slides tipo texto
   quando o body tem classe .paisagem
══════════════════════════════════════════════════════════ */

/* texto com itens: título esq, conteúdo dir */
/* retrato: sc-col1 e sc-col2 empilhados, col2 cresce */
body.retrato .sc-col1{ flex-shrink:0; }
body.retrato .sc-col2{ flex:1; min-height:0; }

/* paisagem: sc-col1 | sc-col2 lado a lado */
body.paisagem .sc.tipo-texto{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 22px;
  align-items:stretch;
}
body.paisagem .sc.tipo-texto .sc-col1{ grid-column:1; }
body.paisagem .sc.tipo-texto .sc-col2{ grid-column:2; }

/* seção: número + texto lado a lado */
body.paisagem .sc-secao{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:0 24px;
  align-content:center;
  padding-bottom:0
}
body.paisagem .secao-num{
  position:static;
  font-size:140px;grid-column:1;grid-row:1/5;
  align-self:center;opacity:.07;
  line-height:1
}
body.paisagem .secao-pretitulo,
body.paisagem .secao-titulo,
body.paisagem .secao-subtitulo,
body.paisagem .secao-texto,
body.paisagem .sc-secao .linha-acento{grid-column:2}

/* capa: título esq, subtítulo dir */
body.paisagem .sc-capa{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 20px;
  align-content:center
}
body.paisagem .capa-pretitulo,
body.paisagem .sc-capa .linha-acento,
body.paisagem .capa-logos,
body.paisagem .capa-hint{grid-column:1/-1}
body.paisagem .capa-titulo{grid-column:1;font-size:90px;align-self:center}
body.paisagem .capa-subtitulo{
  grid-column:2;align-self:center;
  font-size:20px;
  border-left:2px solid var(--red);padding-left:14px;
  margin-bottom:0
}

/* stats: 4 colunas em paisagem */
body.paisagem .stats-grid{grid-template-columns:repeat(4,1fr)}

/* timeline: 2 colunas em paisagem */
body.paisagem .tl-wrap{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}

/* cards: 2 colunas em paisagem */
body.paisagem .cards-grid{display:grid;grid-template-columns:1fr 1fr}

/* comparativo: span full em paisagem */
body.paisagem .comp-grid{grid-column:1/-1}

/* tamanhos menores em paisagem para caber na altura */
body.paisagem .slide-titulo{font-size:27px}
body.paisagem .bloco-lista li,
body.paisagem .slide-texto{font-size:16px}
body.paisagem .sc{padding:18px 22px 18px}

/* sem override extra para paisagem — col-bg é absoluto */

/* ══════════ IMAGEM EM QUADRO / IMAGEM PEQUENA ═══════════ */
.img-quadro{margin:10px 0;border-radius:var(--r-md);overflow:hidden;border:1px solid rgba(255,255,255,.18);box-shadow:0 3px 14px rgba(0,0,0,.35);flex-shrink:0;position:relative;z-index:1}
.tema-claro .img-quadro{border-color:var(--border);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.img-quadro img{display:block;width:100%;object-fit:cover}
.img-legenda{font-size:12px;line-height:1.4;color:var(--fg2);padding:6px 10px;background:rgba(0,0,0,.35)}
.tema-claro .img-legenda{background:var(--bg-lt)}
.img-pequena{display:block;border-radius:var(--r);object-fit:cover;max-width:100%;flex-shrink:0;position:relative;z-index:1}

/* ══════════ INDICADOR DE ORIENTAÇÃO ════════════════════ */
#orient-hint{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(0,0,0,.8);color:#fff;
  font-size:15px;text-align:center;padding:8px;
  display:none;z-index:9999;font-family:'Barlow',sans-serif
}

/* ══════════ FULLSCREEN ══════════════════════════════════ */
#btn-fullscreen{
  position:fixed;bottom:14px;right:14px;z-index:10000;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.18);
  border-radius:6px;padding:7px 11px;
  font-size:17px;color:rgba(255,255,255,.8);
  cursor:pointer;transition:all .2s;
  font-family:'Barlow',sans-serif;
  line-height:1
}
#btn-fullscreen:hover{background:rgba(204,17,17,.7);border-color:transparent;color:#fff}
:fullscreen #btn-fullscreen,:-webkit-full-screen #btn-fullscreen{bottom:env(safe-area-inset-bottom,14px)}

@media (display-mode:fullscreen){
  body{background:#000}
  #btn-fullscreen{display:none}
}

/* Safe area — notch / barra do sistema */
html{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}

@media (max-width:540px){
  body.retrato #shell{padding:0}
  body.retrato #viewport{max-height:100%;border-radius:0}
}
@media (max-height:420px){
  body.paisagem #shell{padding:0}
  body.paisagem #viewport{max-height:100%;border-radius:0}
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════ IMAGEM RODAPÉ — fundo parcial na coluna ══════════
   .sc-col1 / .sc-col2: colunas explícitas com position:relative
   .col-bg: div absoluto no fundo da coluna com a imagem
             + gradiente transparente → imagem (de cima p/ baixo)
   O texto fica sobreposto com z-index superior.
   Parâmetro JSON:  imagem_rodape.coluna = 1 | 2
═══════════════════════════════════════════════════════════════ */
.sc-col1, .sc-col2{
  position:relative;
  display:flex;
  flex-direction:column;
  /* overflow visível: excesso é detectado pelo ajuste de escala
     (overflow:hidden aqui truncava texto no fundo em paisagem) */
  overflow:visible;
}
.col-bg{
  position:absolute;
  bottom:0; left:0; right:0;
  height:55%;          /* ocupa metade inferior da coluna */
  background-size:cover;
  background-position:center bottom;
  background-repeat:no-repeat;
  z-index:0;
  /* gradiente: transparente em cima → imagem em baixo */
  -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 55%);
  mask-image:linear-gradient(to bottom, transparent 0%, black 55%);
}
/* garante texto acima do fundo (paisagem) */
.sc-col1 > :not(.col-bg),
.sc-col2 > :not(.col-bg){
  position:relative;
  z-index:1;
}

/* ══ RETRATO: imagem vira bloco separado abaixo do texto ══ */
body.retrato .sc-col1,
body.retrato .sc-col2{ overflow:visible; }
body.retrato .col-bg{
  position:relative !important;
  height:200px !important;
  bottom:auto !important; left:auto !important; right:auto !important;
  border-radius:var(--r);
  margin-top:8px;
  flex-shrink:0;
  -webkit-mask-image:none !important;
  mask-image:none !important;
}
</style>

<script>
/* ═══ CONFIGURAÇÃO ═══════════════════════════════════════
   ESCURECIMENTO_PADRAO: véu escuro sobre imagens de fundo (0 a 1).
   Vale para todo slide cujo "imagem_escurecimento" seja 0 ou ausente.
   Para um slide específico: "imagem_escurecimento": 0.3 (mais claro),
   0.8 (mais escuro) ou -1 (imagem totalmente viva, sem véu).
   Para letras ESCURAS sobre o fundo use "imagem_clareamento": 0 a 1
   (véu branco; quando presente e > 0, substitui o escurecimento). */
const ESCURECIMENTO_PADRAO = 0.55;

/* ═══ DADOS EMBUTIDOS ════════════════════════════════════ */
let SLIDES = [];

async function carregarSlides(){
  try {
    const indice = await fetch('dados/indice.json').then(r=>r.json());
    SLIDES = await Promise.all(
      indice.map(arq =>
        fetch('dados/'+arq)
          .then(r=>{ if(!r.ok) throw new Error(arq+' não encontrado'); return r.json(); })
          .catch(()=>({tipo:'texto',titulo:'Erro ao carregar',texto:'Arquivo não encontrado: '+arq,tema:'vermelho'}))
      )
    );
  } catch(e) {
    document.getElementById('slides-wrap').innerHTML =
      '<div style="color:#fff;padding:32px;font-family:sans-serif">' +
      '<h2 style="color:#CC1111;margin-bottom:12px">Erro ao carregar slides</h2>' +
      '<p style="font-size:13px;line-height:1.6">'+e.message+'</p>' +
      '<p style="font-size:12px;margin-top:12px;opacity:.6">Para rodar localmente use:<br>' +
      '<code>python -m http.server 8000</code></p></div>';
    throw e;
  }
}
/* ═══ ÍCONES ═════════════════════════════════════════════ */
const IC={
  video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
  artigo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>',
  audio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0118 0v6"/><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/></svg>'
};

/* ═══ HELPERS ════════════════════════════════════════════ */
const E=s=>s||'';
function imgBg(d){
  let url=d.imagem_url||'';
  let dim=d.imagem_escurecimento;
  const clar=d.imagem_clareamento||0;
  dim=(dim==null||dim===0)?ESCURECIMENTO_PADRAO:(dim<0?0:dim);
  if(clar>0)dim=0; // clareamento substitui o escurecimento
  if(!url)return'';
  const pos={centro:'center center',topo:'center top',baixo:'center bottom',esquerda:'left center',direita:'right center'}[d.imagem_posicao]||'center center';
  let dimHtml='';
  if(dim>0)dimHtml='<div class="bg-dim" style="opacity:'+dim+'"></div>';
  else if(clar>0)dimHtml='<div class="bg-dim" style="background:#fff;opacity:'+clar+'"></div>';
  const guard='<img src="'+url+'" style="display:none" alt="" '
    +'onerror="var p=this.parentNode;p.style.backgroundImage=\'none\';'
    +'var s=p.nextElementSibling;if(s&&s.classList.contains(\'bg-dim\'))s.style.display=\'none\'">';
  return'<div class="bg-img" style="background-image:url(\''+url+'\');background-position:'+pos+';background-size:cover">'+guard+'</div>'+dimHtml;
}
function proposta(p){return p?'<div class="bloco-proposta"><div class="proposta-titulo">'+E(p.titulo)+'</div><div class="proposta-texto">'+E(p.texto)+'</div></div>':''}
function diferencial(t){return t?'<div class="bloco-diff"><span class="diff-s">≠</span>'+E(t)+'</div>':''}
function lista(its){return its&&its.length?'<ul class="bloco-lista">'+its.map(i=>'<li>'+i+'</li>').join('')+'</ul>':''}
function links(ls){
  if(!ls||!ls.length)return'';
  // URL inválida: vazia, placeholder 'https://...' ou só 'https://'
  function urlValida(u){ return u&&u.trim()!==''&&u.trim()!=='https://...'&&u.trim()!=='https://'; }
  const itens=ls.map(l=>{
    if(urlValida(l.url)){
      return'<a class="link-btn" href="'+l.url+'" target="_blank" rel="noopener"><span class="link-icon">'+(IC[l.icone]||IC.link)+'</span>'+l.texto+'</a>';
    } else {
      return'<span class="link-btn link-falta"><span class="link-icon">'+(IC[l.icone]||IC.link)+'</span>'+l.texto+' <em>— falta link</em></span>';
    }
  });
  return'<div class="bloco-links"><div class="links-label">Aprofunde:</div><div class="links-wrap">'+itens.join('')+'</div></div>';
}

function colBg(d){
  if(!d.imagem_rodape||!d.imagem_rodape.url)return'';
  const r=d.imagem_rodape;
  const pos=r.posicao||'center bottom';
  const h=r.altura_bg||'55%'; // altura do fundo na coluna (padrão 55%)
  return'<div class="col-bg" style="background-image:url(\''+r.url+'\');background-position:'+pos+';height:'+h+'" onerror="this.style.display=\'none\'"></div>';
}
// mantém imgRodape como alias vazio para compatibilidade com comparativo
function imgRodape(d){ return''; }
function imgRodapeFooter(d){
  if(!d.imagem_rodape||!d.imagem_rodape.url)return'';
  const r=d.imagem_rodape;
  const pos=r.posicao||'center center';
  const h=(r.altura||200)+'px';
  const w=r.largura||'100%';
  return'<div style="width:'+w+';height:'+h+';background-image:url(\''+r.url+'\');background-size:cover;background-position:'+pos+';background-repeat:no-repeat;border-radius:var(--r);margin-top:8px;flex-shrink:0"></div>';
}
/* imagem em quadro: figura com moldura, sombra e legenda opcional
   JSON: "imagem_quadro": { "url", "legenda", "altura" (px),
         "posicao" (ex: "center top"), "coluna": 1|2 (tipo texto) } */
function imgQuadro(q){
  if(!q||!q.url)return'';
  const h=q.altura?'height:'+q.altura+'px;':'';
  const pos=q.posicao||'center center';
  return'<figure class="img-quadro"><img src="'+q.url+'" alt="" loading="lazy" style="'+h+'object-position:'+pos
    +'" onerror="this.parentNode.style.display=\'none\'">'
    +(q.legenda?'<figcaption class="img-legenda">'+q.legenda+'</figcaption>':'')
    +'</figure>';
}
/* imagem pequena: para colocar em quadros ou colunas
   JSON: "imagem_pequena": { "url", "largura" (px, padrão 120),
         "altura" (px), "alinhamento": "esquerda"|"centro"|"direita",
         "coluna": 1|2 (tipo texto) } */
function imgPequena(p){
  if(!p||!p.url)return'';
  const w=(p.largura||120)+'px';
  const h=p.altura?'height:'+p.altura+'px;':'';
  const mg={centro:'8px auto',direita:'8px 0 8px auto'}[p.alinhamento]||'8px 0';
  return'<img class="img-pequena" src="'+p.url+'" alt="" loading="lazy" style="width:'+w+';'+h
    +'margin:'+mg+'" onerror="this.style.display=\'none\'">';
}
function colItens(its){return(its||[]).map(it=>'<div class="col-item'+(it.estilo==='destaque'?' col-item-destaque':'')+'">'+it.texto+'</div>').join('')}

/* ═══ RENDERIZADORES ══════════════════════════════════════ */
const R={
  capa(d){
    const logos=(d.logos||[]).map(u=>'<img class="capa-logo-img" src="'+u+'" alt="" loading="lazy">').join('');
    return imgBg(d)+'<div class="sc sc-capa'+(d.texto_borda?' tb':'')+'"><div class="capa-pretitulo">'+E(d.pre_titulo)+'</div>'+(d.tem_linha_acento?'<div class="linha-acento"></div>':'')+'<div class="capa-titulo">'+E(d.titulo)+'</div><p class="capa-subtitulo">'+E(d.subtitulo)+'</p>'+(logos?'<div class="capa-logos">'+logos+'</div>':'')+links(d.links)+imgRodape(d)+'<div class="capa-hint">← deslize para navegar →</div></div>';
  },
  encerramento(d){
    const logos=(d.logos||[]).map(u=>'<img class="capa-logo-img" src="'+u+'" alt="" loading="lazy">').join('');
    const linksHtml=links(d.links||[]);
    return imgBg(d)+'<div class="sc sc-capa'+(d.texto_borda?' tb':'')+'"><div class="capa-pretitulo">'+E(d.pre_titulo)+'</div>'+(d.tem_linha_acento?'<div class="linha-acento"></div>':'')
    +'<div class="enc-titulo">'+E(d.titulo)+'</div>'
    +'<p class="capa-subtitulo">'+E(d.subtitulo)+'</p>'
    +(logos?'<div class="capa-logos">'+logos+'</div>':'')
    +linksHtml
    +'<div class="capa-hint">← deslize para navegar →</div></div>';
  },
  secao(d){
    return imgBg(d)+'<div class="sc sc-secao'+(d.texto_borda?' tb':'')+'"><div class="secao-num">'+E(d.numero_gigante)+'</div><div class="secao-pretitulo">'+E(d.pre_titulo)+'</div>'+(d.tem_linha_acento?'<div class="linha-acento"></div>':'')+'<div class="secao-titulo">'+E(d.titulo)+'</div><p class="secao-subtitulo">'+E(d.subtitulo)+'</p>'+(d.texto?'<p class="secao-texto">'+d.texto+'</p>':'')+'</div>';
  },
  texto(d){
    const r=d.imagem_rodape||{};
    const col=r.coluna||1; // 1=coluna esquerda, 2=coluna direita
    const bg=colBg(d);
    const qCol=(d.imagem_quadro&&d.imagem_quadro.coluna)||1;
    const pCol=(d.imagem_pequena&&d.imagem_pequena.coluna)||1;
    const q=imgQuadro(d.imagem_quadro),p=imgPequena(d.imagem_pequena);
    return imgBg(d)
      +'<div class="sc tipo-texto'+(d.texto_borda?' tb':'')
      +'"><div class="sc-col1">'
      +(d.modulo?'<div class="slide-modulo">'+E(d.modulo)+'</div>':'')
      +(d.pre_titulo?'<div class="slide-pretitulo">'+E(d.pre_titulo)+'</div>':'')
      +'<h2 class="slide-titulo">'+E(d.titulo)+'</h2>'
      +(d.subtitulo?'<p class="slide-subtitulo">'+d.subtitulo+'</p>':'')
      +(d.texto?'<p class="slide-texto">'+d.texto+'</p>':'')
      +lista(d.itens_col1)
      +(qCol===1?q:'')
      +(pCol===1?p:'')
      +(col===1?bg:'')
      +'</div>'
      +'<div class="sc-col2">'
      +lista(d.itens)
      +proposta(d.proposta)
      +diferencial(d.diferencial)
      +(qCol===2?q:'')
      +(pCol===2?p:'')
      +links(d.links)
      +(col===2?bg:'')
      +'</div>'
      +'</div>';  },
  dividido(d){
    const esq=(d.itens_esquerda||[]).map(it=>'<div class="div-item"><strong>'+it.titulo+'</strong><p>'+it.texto+'</p></div>').join('');
    return imgBg(d)+'<div class="sc'+(d.texto_borda?' tb':'')+'"><div class="slide-modulo">'+E(d.modulo)+'</div><div class="slide-pretitulo">'+E(d.pre_titulo)+'</div><h2 class="slide-titulo">'+E(d.titulo)+'</h2><div class="div-grid">'+esq+'</div>'+proposta(d.proposta)+diferencial(d.diferencial)+imgQuadro(d.imagem_quadro)+imgPequena(d.imagem_pequena)+links(d.links)+'</div>';
  },
  comparativo(d){
    const esq=d.coluna_esquerda||{},dir=d.coluna_direita||{};
    const imgHtml=imgRodape(d);
    // coloca imagem na coluna com menos itens (mais espaço sobrando)
    const nEsq=(esq.itens||[]).length;
    const nDir=(dir.itens||[]).length;
    const imgEmEsq=imgHtml&&nEsq<=nDir;
    const imgW=imgHtml?'<div class="img-rodape-col">'+imgHtml+'</div>':'';
    return imgBg(d)+'<div class="sc'+(d.texto_borda?' tb':'')+'"><div class="slide-modulo">'+E(d.modulo)+'</div><div class="slide-pretitulo">'+E(d.pre_titulo)+'</div><h2 class="slide-titulo">'+E(d.titulo)+'</h2>'+(d.texto?'<p class="slide-texto">'+d.texto+'</p>':'')
    +'<div class="comp-grid">'
    +'<div class="comp-col cor-'+(esq.cor||'escuro')+'"><div class="comp-col-titulo">'+E(esq.titulo)+'</div>'+colItens(esq.itens)+imgPequena(esq.imagem)+(imgEmEsq?imgW:'')+'</div>'
    +'<div class="comp-col cor-'+(dir.cor||'escuro')+'"><div class="comp-col-titulo">'+E(dir.titulo)+'</div>'+colItens(dir.itens)+imgPequena(dir.imagem)+(!imgEmEsq?imgW:'')+'</div>'
    +'</div>'+diferencial(d.diferencial)+imgQuadro(d.imagem_quadro)+imgPequena(d.imagem_pequena)+imgRodapeFooter(d)+links(d.links)+'</div>';
  },
  estatisticas(d){
    const stats=(d.estatisticas||[]).map(s=>'<div class="stat-card cor-'+(s.cor||'escuro')+'">'+(s.imagem_url?'<img class="stat-img'+(s.imagem_modo&&s.imagem_modo!=='foto'?' modo-'+s.imagem_modo:'')+'" src="'+s.imagem_url+'" alt="" onerror="this.style.display=\'none\'">':'')+'<div class="stat-num">'+s.numero+'</div><div class="stat-desc">'+s.descricao+'</div><div class="stat-fonte">'+s.fonte+'</div></div>').join('');
    return imgBg(d)+'<div class="sc'+(d.texto_borda?' tb':'')+'"><div class="slide-modulo">'+E(d.modulo)+'</div><div class="slide-pretitulo">'+E(d.pre_titulo)+'</div><h2 class="slide-titulo">'+E(d.titulo)+'</h2>'+(d.subtitulo?'<p class="slide-subtitulo">'+d.subtitulo+'</p>':'')+'<div class="stats-grid">'+stats+'</div>'+diferencial(d.diferencial)+imgQuadro(d.imagem_quadro)+imgPequena(d.imagem_pequena)+links(d.links)+'</div>';
  },
  citacao(d){
    return imgBg(d)+'<div class="sc sc-citacao'+(d.texto_borda?' tb':'')+'"><div class="slide-modulo">'+E(d.modulo)+'</div>'+(d.tem_linha_acento?'<div class="linha-acento"></div>':'')+'<blockquote class="cit-texto">'+E(d.titulo)+'</blockquote><div class="cit-fonte">'+E(d.pre_titulo)+'</div>'+(d.subtitulo?'<p class="cit-nota">'+d.subtitulo+'</p>':'')+'</div>';
  },
  timeline(d){
    const its=(d.itens_timeline||[]).map(it=>'<div class="tl-item"><div class="tl-ano">'+it.ano+'</div><div class="tl-texto">'+it.texto+'</div></div>').join('');
    return imgBg(d)+'<div class="sc'+(d.texto_borda?' tb':'')+'"><div class="slide-modulo">'+E(d.modulo)+'</div><div class="slide-pretitulo">'+E(d.pre_titulo)+'</div><h2 class="slide-titulo">'+E(d.titulo)+'</h2><div class="tl-wrap">'+its+'</div>'+diferencial(d.diferencial)+imgQuadro(d.imagem_quadro)+imgPequena(d.imagem_pequena)+'</div>';
  },
  cards(d){
    const cs=(d.cards||[]).map(c=>{
      const foto=c.foto_url?'<div class="card-foto" style="background-image:url(\''+c.foto_url+'\')"></div>':'<div class="card-foto card-foto-vazia"><span>'+c.nome.charAt(0)+'</span></div>';
      return'<div class="card-item">'+foto+'<div><div class="card-nome">'+c.nome+'</div><div class="card-cargo">'+c.cargo+'</div><div class="card-texto">'+c.texto+'</div></div></div>';
    }).join('');
    return imgBg(d)+'<div class="sc'+(d.texto_borda?' tb':'')+'"><div class="slide-modulo">'+E(d.modulo)+'</div><div class="slide-pretitulo">'+E(d.pre_titulo)+'</div><h2 class="slide-titulo">'+E(d.titulo)+'</h2>'+(d.subtitulo?'<p class="slide-subtitulo">'+d.subtitulo+'</p>':'')+'<div class="cards-grid">'+cs+'</div>'+imgQuadro(d.imagem_quadro)+imgPequena(d.imagem_pequena)+'</div>';
  }
};

/* ═══ MOTOR ══════════════════════════════════════════════ */
let atual=0;
let total=0;
let slideEls=[];
const wrap=document.getElementById('slides-wrap');

function ir(n){
  if(n<0||n>=total)return;
  const ant=atual;
  slideEls[ant].classList.remove('ativo');
  slideEls[ant].classList.add(n>ant?'sair-esq':'sair-dir');
  atual=n;
  slideEls[atual].classList.add('ativo');
  slideEls[atual].classList.remove('sair-esq','sair-dir');
  slideEls[atual].scrollTop=0;
  setTimeout(()=>slideEls[ant].classList.remove('sair-esq','sair-dir'),300);
  ajustarEscala(slideEls[atual]);
  atualizarUI();
}

/* ═══ AJUSTE DE ESCALA — evita truncar texto no fundo ═════
   Só em paisagem: se o conteúdo não cabe na altura do slide,
   reduz o zoom gradualmente (até 68%). Abaixo disso, mantém
   a rolagem. No retrato o slide rola normalmente. */
function ajustarEscala(el){
  const sc=el.querySelector('.sc');
  if(!sc)return;
  sc.style.zoom='';
  if(!document.body.classList.contains('paisagem'))return;
  let z=1;
  while(z>0.68&&sc.scrollHeight>sc.clientHeight+1){
    z=Math.round((z-0.04)*100)/100;
    sc.style.zoom=z;
  }
}
function ajustarTodas(){slideEls.forEach(ajustarEscala)}

function atualizarUI(){
  if(!total)return;
  const pct=total>1?(atual/(total-1))*100:100;
  document.getElementById('prog-h').style.width=pct+'%';
  document.getElementById('prog-v').style.height=pct+'%';
  document.getElementById('counter-h').textContent=(atual+1)+' / '+total;
  document.getElementById('counter-v').textContent=(atual+1)+' / '+total;
  ['btn-prev-h','btn-prev-v'].forEach(id=>document.getElementById(id).disabled=atual===0);
  ['btn-next-h','btn-next-v'].forEach(id=>document.getElementById(id).disabled=atual===total-1);
}

// Botões
document.getElementById('btn-prev-h').onclick=()=>ir(atual-1);
document.getElementById('btn-next-h').onclick=()=>ir(atual+1);
document.getElementById('btn-prev-v').onclick=()=>ir(atual-1);
document.getElementById('btn-next-v').onclick=()=>ir(atual+1);

// Teclado
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')ir(atual+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')ir(atual-1);
});

// Touch / swipe
let tx=0,ty=0;
wrap.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
wrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  const dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>36)dx<0?ir(atual+1):ir(atual-1);
},{passive:true});

/* ═══ DETECÇÃO DE ORIENTAÇÃO ══════════════════════════════ */
function aplicarOrientacao(){
  const paisagem=window.innerWidth>window.innerHeight;
  document.body.classList.toggle('paisagem',paisagem);
  document.body.classList.toggle('retrato',!paisagem);
  if(slideEls.length)ajustarTodas();
}
let orientTimer;
function aoGirar(){
  const hint=document.getElementById('orient-hint');
  hint.style.display='block';
  clearTimeout(orientTimer);
  orientTimer=setTimeout(()=>{aplicarOrientacao();hint.style.display='none';},180);
}
window.addEventListener('orientationchange',aoGirar);
window.addEventListener('resize',()=>{clearTimeout(orientTimer);orientTimer=setTimeout(aplicarOrientacao,80);});

// Inicialização assíncrona
(async()=>{
  wrap.innerHTML=
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#111;color:rgba(255,255,255,.4);font-family:Barlow,sans-serif;font-size:13px;gap:10px">'+
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#CC1111" stroke-width="2" style="animation:spin 1s linear infinite"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>'+
    'Carregando slides\u2026</div>';

  await carregarSlides();

  wrap.innerHTML='';
  SLIDES.forEach((d,i)=>{
    const div=document.createElement('div');
    div.className='slide tema-'+(d.tema||'claro');
    div.dataset.i=i;
    div.innerHTML=(R[d.tipo]||R.texto)(d);
    wrap.appendChild(div);
  });

  slideEls=Array.from(wrap.querySelectorAll('.slide'));
  total=slideEls.length;
  if(slideEls.length>0)slideEls[0].classList.add('ativo');
  atualizarUI();
  aplicarOrientacao();
  // reajusta quando as fontes e imagens terminarem de carregar
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(ajustarTodas);
  window.addEventListener('load',ajustarTodas);
})();

/* ═══ FULLSCREEN API ════════════════════════════════════ */
document.getElementById('btn-fullscreen').addEventListener('click',()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    (el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen).call(el)
      .catch(()=>{});
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen)
      .call(document);
  }
});
document.addEventListener('fullscreenchange',()=>{
  document.getElementById('btn-fullscreen').textContent=
    document.fullscreenElement ? '✕' : '⛶';
});
</script>
